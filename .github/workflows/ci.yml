# Runs the same gates as the local git hook (pnpm check) on every push to dev and every pull request, so a change reaches main only
# after they pass; protocol models (pnpm model) stay a manual gate, see docs/internals/model.md.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      # LLVM for compiling SQLite to wasm, at the version src/build-wasm.mjs pins; the token lifts GitHub's anonymous rate limit
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - name: Install LLVM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          llvm=$(grep -o 'github:llvm/llvm-project@llvmorg-[0-9.]*' src/build-wasm.mjs)
          mise install "$llvm"
      # The wasm-bindgen CLI at the version rust/Cargo.toml pins, where src/build-wasm.mjs runs it from
      - name: Install wasm-bindgen
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' rust/Cargo.toml)
          test -n "$version"
          cd "$RUNNER_TEMP"
          name=wasm-bindgen-$version-x86_64-unknown-linux-musl
          base=https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version
          curl -sSfLO "$base/$name.tar.gz"
          curl -sSfL "$base/$name.tar.gz.sha256sum" | sed 's|gh-release/||' | sha256sum --check
          tar -xzf "$name.tar.gz"
          install "$name/wasm-bindgen" ~/.cargo/bin/
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: .check/*.log
