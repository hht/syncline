\* Liveness (gate scale): after a backend write makes a 3-write run fail on cloud and fall back to one by one, all devices eventually have no pending writes and match cloud state.
CONSTANTS
    Devices = {d1}
    NT = 1
    NR = 1
    MaxVal = 3
    MaxMuts = 3
    MaxCrashes = 0
    MaxDeploys = 0
    MaxRestores = 0
    MaxBackups = 0
    MaxDrops = 0
    MaxDups = 0
    MaxBackendWrites = 1
    MaxChunks = 0
    MaxDeletes = 0
    MaxStorageErrors = 0
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 0
    MaxCorrupts = 0
    MaxRefetches = 0
SPECIFICATION LiveSpec
PROPERTY P9_Converges
INVARIANTS
    P1_AtMostOnceInOrder
    P2_NoLostWrite
    P3_NoGap
    HistConsistent
    P5_ClientView
    P6_Converged
    P7_AckedDropped
    P8k_PendingKept
    P8r_NoRevival
    P8a_IncrementalOnHistory
    P10_ScopeOnly
    P11_ExecutedOnce
