\* Liveness (large config, ~5 min, manual run): after faults (1 crash, 1 dropped message, 1 deployment disconnect, 1 redelivery) cease, all devices eventually have no pending writes and match cloud state.
\* Gate mode: excluded from gate
CONSTANTS
    Devices = {d1, d2}
    NT = 1
    NR = 1
    MaxVal = 1
    MaxMuts = 1
    MaxCrashes = 1
    MaxDeploys = 1
    MaxRestores = 0
    MaxBackups = 0
    MaxDrops = 1
    MaxDups = 1
    MaxBackendWrites = 0
    MaxChunks = 0
    MaxDeletes = 0
    MaxStorageErrors = 0
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 0
    MaxCorrupts = 0
    MaxRefetches = 0
SPECIFICATION LiveSpec
PROPERTY P9_Converges
INVARIANTS
    P1_AtMostOnceInOrder
    P2_NoLostWrite
    P3_NoGap
    HistConsistent
    P5_ClientView
    P6_Converged
    P7_AckedDropped
    P8k_PendingKept
    P8r_NoRevival
    P8a_IncrementalOnHistory
    P10_ScopeOnly
    P11_ExecutedOnce
