    MaxDeploys = 0
    MaxRestores = 0
    MaxBackups = 0
    MaxDrops = 0
    MaxDups = 0
    MaxBackendWrites = 1
    MaxChunks = 1
    MaxDeletes = 1
    MaxStorageErrors = 0
    Later = {}
    Retiring = {2}
    MaxReturns = 1
    MaxHints = 0
    MaxTruncs = 0
    MaxCorrupts = 0
    MaxRefetches = 0
