\* Fanout with rounds arriving late after a shard reset: one shard, 2 buckets, 2 backend writes, and three faults, so a round the fanout gave up on, a shard reset, and a lost or failed catch-up can all happen in one run; the device connects again only after losing its catch-up or when its token expires. Checks CatchesUp besides the invariants: without token expiry it fails (model-mutations.md).
\* Gate mode: exhaustive search, ~6 min (8,890,000 states)
CONSTANTS
    b1 = b1
    b2 = b2
    s1 = s1
    s2 = s2
    Buckets <- MCBuckets
    Shards <- MCOneShard
    Sub <- MCSub
    ResShard = s1
    ResSub <- MCResSub
    MaxWrites = 2
    MaxFaults = 3
    MaxConns = 1
    LateRounds = TRUE
SPECIFICATION Spec
INVARIANTS
    NoWastedPull
    Covers
    Complete
PROPERTIES
    CatchesUp
CHECK_DEADLOCK FALSE
