\* Shared space liveness: 2 tables with 1 row each, 1 rule change with 1 backend write, pull split across 1 intermediate chunk (chunking with subscription changes covered in MCLiveSharedChunk.big.cfg); eventually converges after 1 disconnect, restart, or dropped pull.
\* Gate mode: exhaustive search, ~2.5 min (390,000 states)
