\* Fanout with three writes, as MCFanout.cfg otherwise: exhaustive search does not finish (2 writes already reach 53 million states), so random walks check the invariants.
\* Gate mode: random walk for 60s (exhaustive search does not finish)
CONSTANTS
    b1 = b1
    b2 = b2
    s1 = s1
    s2 = s2
    Buckets <- MCBuckets
    Shards <- MCShards
    Sub <- MCSub
    ResShard = s1
    ResSub <- MCResSub
    MaxWrites = 3
    MaxFaults = 1
    MaxConns = 2
SPECIFICATION Spec
INVARIANTS
    NoWastedPull
    Covers
    Complete
CHECK_DEADLOCK FALSE
