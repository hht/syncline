\* Fanout liveness: as MCFanout.cfg with one connection (a device whose catch-up was lost still reconnects), checking CatchesUp besides the invariants.
\* Gate mode: exhaustive search, ~6.5 min (4,790,000 states)
CONSTANTS
    b1 = b1
    b2 = b2
    s1 = s1
    s2 = s2
    Buckets <- MCBuckets
    Shards <- MCShards
    Sub <- MCSub
    ResShard = s1
    ResSub <- MCResSub
    MaxWrites = 2
    MaxFaults = 1
    MaxConns = 1
    LateRounds = FALSE
SPECIFICATION Spec
INVARIANTS
    NoWastedPull
    Covers
    Complete
PROPERTIES
    CatchesUp
\* Final states with every round acknowledged and both devices caught up have no further steps
CHECK_DEADLOCK FALSE
