\* Shared space (checks S1 only): 1 table with 2 rows, 2 buckets; version 0 has 2 rows (k1 in b1, k2 in both buckets), followed by 2 backend writes (modifying values, moving between buckets, deleting), subscription changes twice (initially {b2}, can revert), pull split across 1 intermediate chunk, 1 disconnect, restart, or dropped pull; cache returns stale copies.
\* Gate mode: exhaustive search, ~26 min (36,730,000 states)
CONSTANTS
    k1 = k1
    k2 = k2
    b1 = b1
    b2 = b2
    KeyOrder <- MCKeyOrder
    TableOf <- MCTableOf
    BucketOrder <- MCBucketOrder
    Rules <- MCRules
    Subs <- MCSubs
    Sub0 = {b2}
    Data0 <- MCData0
    MaxVersions = 2
    MaxRuleChanges = 0
    MaxSubChanges = 2
    MaxRebuilds = 0
    MaxChunks = 1
    MaxFaults = 1
    MaxLatePushes = 0
    MaxTruncs = 0
SPECIFICATION Spec
INVARIANTS
    Consistent
