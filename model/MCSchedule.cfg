\* Schedule: a task that finishes (a), a crasher (c), a delivery rescheduled with At (d); 3 scheduling calls, 3 external resets, pause after 3 unfinished runs.
\* Gate mode: exhaustive search, ~2 s (6,628 states)
CONSTANTS
    a = a
    c = c
    d = d
    Tasks <- MCTasks
    Crashers <- MCCrashers
    Replaced <- MCReplaced
    ResetLimit = 3
    MaxFaults = 3
    MaxRequests = 3
SPECIFICATION Spec
\* Runs end once the scheduling calls are spent and every entry is served; Served catches work left pending.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    Kept
    Bounded
    Exempt
PROPERTIES
    Served
