\* Runs under every fault together: crash, point-in-time recovery, backup cloned to another device, dropped and redelivered messages, storage error, and a backend write: 2 devices, 1 row, 3 writes (MaxVal = 3).
\* Gate mode: random walk for 60s (exhaustive search does not finish; MCPrivateMerge searches runs exhaustively with fewer faults)
CONSTANTS
    Devices = {d1, d2}
    NT = 1
    NR = 1
    MaxVal = 3
    MaxMuts = 3
    MaxCrashes = 1
    MaxDeploys = 0
    MaxRestores = 1
    MaxBackups = 1
    MaxDrops = 1
    MaxDups = 1
    MaxBackendWrites = 1
    MaxChunks = 0
    MaxDeletes = 0
    MaxStorageErrors = 1
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 0
    MaxCorrupts = 0
    MaxRefetches = 0
INIT Init
NEXT Next
INVARIANTS
    P1_AtMostOnceInOrder
    P2_NoLostWrite
    P3_NoGap
    HistConsistent
    P5_ClientView
    P6_Converged
    P7_AckedDropped
    P8k_PendingKept
    P8r_NoRevival
    P8a_IncrementalOnHistory
    P10_ScopeOnly
    P11_ExecutedOnce
