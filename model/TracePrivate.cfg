\* 轨迹核对（TracePrivate.tla）：3 台设备；写都对应表 1 的唯一一行，只在云端、之后进入同步又离开的是表 2；次数上限给够，只由轨迹约束
\* 门禁方式：轨迹核对（pnpm model:trace），不在 pnpm model 里
CONSTANTS
    d1 = d1
    d2 = d2
    d3 = d3
    Devices = {d1, d2, d3}
    NT = 2
    NR = 1
    Later = {2}
    Retiring = {}
    MaxVal = 1000000
    MaxMuts = 1000000
    MaxDeletes = 0
    MaxCrashes = 1000000
    MaxDeploys = 1000000
    MaxRestores = 1
    MaxBackups = 1000000
    MaxDrops = 1000000
    MaxDups = 0
    MaxBackendWrites = 1000000
    MaxChunks = 1000000
    MaxStorageErrors = 1000000
    MaxReturns = 0
    MaxHints = 1000000
    MaxTruncs = 1000000
    MaxCorrupts = 0
    MaxRefetches = 0
SPECIFICATION TraceSpec
INVARIANT Unmatched
CHECK_DEADLOCK FALSE
VIEW TraceView
