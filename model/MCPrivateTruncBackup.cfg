    P1_AtMostOnceInOrder
    P2_NoLostWrite
    P3_NoGap
    HistConsistent
    P5_ClientView
    P6_Converged
    P7_AckedDropped
    P8k_PendingKept
    P8r_NoRevival
    P8a_IncrementalOnHistory
    P10_ScopeOnly
