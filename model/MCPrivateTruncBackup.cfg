    NR = 1
    MaxVal = 2
    MaxMuts = 2
    MaxCrashes = 0
    MaxDeploys = 0
    MaxRestores = 1
    MaxBackups = 1
    MaxDrops = 0
    MaxDups = 0
    MaxBackendWrites = 1
    MaxChunks = 1
    MaxDeletes = 0
    MaxStorageErrors = 0
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 2
    MaxCorrupts = 0
    MaxRefetches = 0
INIT Init
NEXT Next
