\* Log truncation with backup restore, chunked pull, and message redelivery: staged position below floor refetches from scratch; 1 device, 1 row, 3 writes.
\* Gate mode: exhaustive search, ~4.5 min (11,930,000 states)
CONSTANTS
    Devices = {d1}
    NT = 1
    NR = 1
    MaxVal = 2
    MaxMuts = 3
    MaxCrashes = 0
    MaxDeploys = 0
    MaxRestores = 0
    MaxBackups = 1
    MaxDrops = 0
    MaxDups = 1
    MaxBackendWrites = 0
    MaxChunks = 1
    MaxDeletes = 0
    MaxStorageErrors = 0
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 2
    MaxCorrupts = 0
    MaxRefetches = 0
INIT Init
NEXT Next
INVARIANTS
    P1_AtMostOnceInOrder
    P2_NoLostWrite
    P3_NoGap
    HistConsistent
    P5_ClientView
    P6_Converged
    P7_AckedDropped
    P8k_PendingKept
    P8r_NoRevival
    P8a_IncrementalOnHistory
    P10_ScopeOnly
    P11_ExecutedOnce
