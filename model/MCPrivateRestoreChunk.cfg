\* 整份拉到一半时时间点恢复：新装的设备离线写下，拉到第一块后云端恢复；块里的值可能是恢复时回滚掉的版本的，
\* 接着拉时从头重拉（P5），不丢没同步过的写（P8k）；1 台设备、1 行
