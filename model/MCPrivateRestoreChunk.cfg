    MaxMuts = 1
    MaxCrashes = 0
    MaxDeploys = 0
    MaxRestores = 1
    MaxBackups = 0
    MaxDrops = 0
    MaxDups = 0
    MaxBackendWrites = 2
    MaxChunks = 1
    MaxDeletes = 0
    MaxStorageErrors = 0
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 0
    MaxCorrupts = 0
    MaxRefetches = 0
INIT Init
NEXT Next
INVARIANTS
    P1_AtMostOnceInOrder
    P2_NoLostWrite
    P3_NoGap
    HistConsistent
    P5_ClientView
    P6_Converged
    P7_AckedDropped
    P8k_PendingKept
