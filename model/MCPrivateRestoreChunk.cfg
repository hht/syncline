\* Point-in-time recovery mid-full-pull: newly installed device writes offline, cloud restores after chunk 1 arrives; chunk values may belong to rolled-back versions,
\* resumed pull refetches from scratch (P5) without losing unsynced writes (P8k); 1 device, 1 row.
