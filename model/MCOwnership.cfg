\* Ownership: 2 tables, the private space and 2 shared spaces, 2 users (or none), 4 sessions (each release may move tables between spaces and local-only use).
\* Gate mode: exhaustive search, ~25 s (1,278,868 states)
CONSTANTS
    t1 = t1
    t2 = t2
    s1 = s1
    s2 = s2
    u1 = u1
    u2 = u2
    Tables <- MCTables
    Shared <- MCShared
    Users <- MCUsers
    MaxSessions = 4
SPECIFICATION Spec
\* Runs end once the sessions are spent.
CHECK_DEADLOCK FALSE
INVARIANTS
    NoLeak
    Exact
