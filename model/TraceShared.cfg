\* 共用空间的轨迹核对（TraceShared.tla）：12 行、4 个桶、5 种订阅，开始时的订阅由每条轨迹给（TraceSub0）；次数上限给够，只由轨迹约束
\* 门禁方式：轨迹核对（pnpm model:trace），不在 pnpm model 里
CONSTANTS
    KeyOrder <- TraceKeyOrder
    TableOf <- TraceTableOf
    BucketOrder <- TraceBucketOrder
    Rules <- TraceRules
    Subs <- TraceSubs
    Sub0 <- TraceSub0
    Data0 <- TraceData0
    MaxVersions = 99
    MaxRuleChanges = 99
    MaxSubChanges = 1000000
    MaxRebuilds = 0
    MaxChunks = 1000000
    MaxFaults = 1000000
    MaxLatePushes = 0
    MaxTruncs = 0
SPECIFICATION TraceSpec
INVARIANT Unmatched
VIEW TraceView
CHECK_DEADLOCK FALSE
