\* Log truncation with point-in-time recovery (restore rolls back log floor) and requested resync: 1 device, 1 row, 2 writes, 1 backend write.
\* Gate mode: exhaustive search, ~19 min (51,240,000 states)
CONSTANTS
    Devices = {d1}
    NT = 1
    NR = 1
    MaxVal = 2
    MaxMuts = 2
    MaxCrashes = 0
    MaxDeploys = 0
    MaxRestores = 1
    MaxBackups = 0
    MaxDrops = 0
    MaxDups = 0
    MaxBackendWrites = 1
    MaxChunks = 1
    MaxDeletes = 0
    MaxStorageErrors = 0
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 2
    MaxCorrupts = 0
    MaxRefetches = 0
INIT Init
NEXT Next
INVARIANTS
    P1_AtMostOnceInOrder
    P2_NoLostWrite
    P3_NoGap
    HistConsistent
    P5_ClientView
    P6_Converged
    P7_AckedDropped
    P8k_PendingKept
    P8r_NoRevival
    P8a_IncrementalOnHistory
    P10_ScopeOnly
    P11_ExecutedOnce
