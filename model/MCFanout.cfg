\* Fanout: 2 buckets, 2 shards, device subscribes to b1 (connects twice, may switch shards), resident device connected to s1 subscribing to b2, 2 backend writes (touching b1, b2, both, or a keyless version: rule changes, rebuilds) that may land between a round's send and its arrival, one fault (a round lost, a send timing out, an acknowledgment lost, a shard query failing, a shard reset, or a shared space restart). Safety only: CatchesUp is checked in MCFanoutLive.cfg, and three writes in MCFanoutWrites.cfg.
\* Gate mode: exhaustive search, ~5 min (52,720,000 states)
CONSTANTS
    b1 = b1
    b2 = b2
    s1 = s1
    s2 = s2
    Buckets <- MCBuckets
    Shards <- MCShards
    Sub <- MCSub
    ResShard = s1
    ResSub <- MCResSub
    MaxWrites = 2
    MaxFaults = 1
    MaxConns = 2
SPECIFICATION Spec
INVARIANTS
    NoWastedPull
    Covers
    Complete
\* Final states with every round acknowledged and both devices caught up have no further steps
CHECK_DEADLOCK FALSE
