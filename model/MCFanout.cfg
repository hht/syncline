\* Fanout: 2 buckets, 2 shards, device subscribes to b1 (connects twice, may switch shards), resident device connected to s1 subscribing to b2, 3 backend writes (touching b1, b2, both, or a keyless version: rule changes, rebuilds), fanout ack dropped, shard reset or shared space restart once.
