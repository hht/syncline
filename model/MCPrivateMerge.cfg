\* Runs: consecutive writes of one client in a push commit as one; crash leaves two clients' writes in one push, a backend write makes a run fail on cloud (falls back to one by one): 1 device, 1 row, 3 writes (MaxVal = 3).
\* Point-in-time recovery, backup cloning, redelivery, and storage errors with 2-write runs: MCPrivateJumpBackup, MCPrivateJumpClone (also redelivery), MCPrivateStorage.
\* Gate mode: exhaustive search, ~4 min (8,490,000 states)
CONSTANTS
    Devices = {d1}
    NT = 1
    NR = 1
    MaxVal = 3
    MaxMuts = 3
    MaxCrashes = 1
    MaxDeploys = 0
    MaxRestores = 0
    MaxBackups = 0
    MaxDrops = 0
    MaxDups = 0
    MaxBackendWrites = 1
    MaxChunks = 0
    MaxDeletes = 0
    MaxStorageErrors = 0
    Later = {}
    Retiring = {}
    MaxReturns = 0
    MaxHints = 0
    MaxTruncs = 0
    MaxCorrupts = 0
    MaxRefetches = 0
