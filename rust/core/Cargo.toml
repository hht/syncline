[package]
name = "syncline"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
self_cell.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

# Used in tests to count executed SQLite statements and interrupt on a specific statement (same approach as wasm fault injection)
[dev-dependencies]
rusqlite = { workspace = true, features = ["trace"] }

# Enabled for test builds: receives pull results and messages directly fed by tests, resyncs, and verifies checksums via client [`Probe`], bypassing network connections
[features]
testing = []

[lints]
workspace = true
