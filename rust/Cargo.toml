[workspace]
resolver = "3"
members = ["core", "native", "wasm"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# session: records local write changes; hooks: authorizer (rejects PRAGMAs during integrator statement execution)
rusqlite = { version = "0.41.1", features = ["session", "hooks"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parses every double exactly (the default parser can be an ulp off for 16 or 17 significant digits), so reals read back as written
serde_json = { version = "1", features = ["float_roundtrip"] }
self_cell = "1"
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
# Used only in native C interfaces, JNI, and poll: write expect with a reason at those sites
unsafe_code = "deny"
# Unused declared dependencies (built into rustc, off by default)
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppressions must use expect with a reason: expect triggers when lint no longer fires so unused suppressions are removed
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Profile used for testing wasm builds: optimizes like release with overflow checks and debug assertions enabled. cargo test and clippy use dev for faster compilation and lower CPU usage.
# @see https://doc.rust-lang.org/cargo/reference/profiles.html#custom-profiles
[profile.wasm-test]
inherits = "dev"
opt-level = 3

# Mobile release build: whole-program optimization and dead-code stripping for smaller size and faster execution; panics unwind and are caught by the core thread before returning to JS
# @see https://doc.rust-lang.org/cargo/reference/profiles.html#release
[profile.release]
lto = true
codegen-units = 1

# Web wasm build: optimized for size. Function name sections are stripped by wasm-bindgen (stripping here would remove target_features needed by wasm-bindgen)
[profile.web]
inherits = "release"
opt-level = "s"
