[package]
name = "syncline-native"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# iOS links a static library (Xcode links into the app); Android loads a dynamic library (System.loadLibrary); rlib is for cargo test
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
syncline = { path = "../core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Networking: WebSocket (handshake and framing only; TLS wired up manually), HTTP pull (gzip: sends Accept-Encoding and decompresses automatically, reducing pull JSON by ~90%)
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }
# Explicitly use ring for TLS (rustls panics at handshake if both crypto providers are compiled in); random bytes also come from ring
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17.14"
# Wait on sockets and wake pipes (poll)
libc = "0.2.191"

# Construct gzipped bodies in tests (already pulled in by ureq's gzip feature)
[dev-dependencies]
flate2 = "1.1.10"

# Kotlin-to-Rust FFI: used on Android only; host clippy also checks it (see cfg in src/android.rs)
[target.'cfg(not(target_os = "ios"))'.dependencies]
jni = "0.22.4"

# Certificate verification (Network in src/socket.rs, agent in src/http.rs): delegates to the OS on Apple platforms, and uses bundled Mozilla root certificates elsewhere (Android); see docs/internals/adr.md.
# Host macOS clippy and tests also compile the Apple path
[target.'cfg(target_vendor = "apple")'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["platform-verifier"] }
rustls-platform-verifier = "0.7.1"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
webpki-roots = "1.0.11"

[lints]
workspace = true
