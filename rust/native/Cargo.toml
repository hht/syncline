[package]
name = "syncline-native"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# iOS 链静态库（Xcode 链进 App），Android 加载动态库（System.loadLibrary）；rlib 给 cargo test
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
syncline = { path = "../core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# 网络：WebSocket（只用它的握手与帧，TLS 自己接上）、HTTP 拉取（gzip：请求带 Accept-Encoding、自动解压，拉取的 JSON 约小九成）
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }
# TLS 显式用 ring（两种加密实现都编进来时 rustls 不知道用哪个，握手时 panic）；随机数也从 ring 取
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17.14"
# 等 socket 与唤醒用的管道（poll）
libc = "0.2.191"

# 测试里造 gzip 的正文（ureq 的 gzip 本来就带着它）
[dev-dependencies]
flate2 = "1.1.10"

# Kotlin 调 Rust：只有 Android 用；宿主上 clippy 也查它（src/android.rs 的 cfg）
[target.'cfg(not(target_os = "ios"))'.dependencies]
jni = "0.22.4"

# 证书怎么校验（src/socket.rs 的 Network、src/http.rs 的 agent）：苹果的系统上交给系统，其余（Android）用内置的 Mozilla 根证书，理由见 docs/internals/adr.md；
# 宿主 macOS 上 clippy 与测试也编苹果这一路
[target.'cfg(target_vendor = "apple")'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["platform-verifier"] }
rustls-platform-verifier = "0.7.1"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
webpki-roots = "1.0.11"

[lints]
workspace = true
