[package]
name = "syncline-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
syncline = { path = "../core" }
# serialize：从整库导出恢复（测试里当作系统备份）；trace（与工作区开着的 hooks）：测试注入故障（faults）
rusqlite = { workspace = true, features = ["serialize", "trace"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

# rusqlite 在 wasm 上用的 SQLite：它要的宿主函数（休眠、随机数、时钟、本地时间）用它带的 wasm-bindgen 实现；版本跟 rusqlite 用的那份
[target.'cfg(target_family = "wasm")'.dependencies]
sqlite-wasm-rs = { version = "0.6.2", features = ["wasm-bindgen"] }
# web 上的库文件放在 OPFS（src/opfs.rs）
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
# 导出的 async 函数（装 OPFS）经它变成 Promise，版本跟 wasm-bindgen
wasm-bindgen-futures = "=0.4.80"

# 测试的构建打开：注入存储故障（src/faults.rs），核心收测试直接喂的拉取结果与消息（client 的 Probe）
[features]
testing = ["syncline/testing"]

[lints]
workspace = true
