[package]
name = "syncline-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
syncline = { path = "../core" }
# serialize: restore from whole-database export (used as system backup in tests); trace (with workspace hooks): inject storage faults for tests
rusqlite = { workspace = true, features = ["serialize", "trace"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

# SQLite used by rusqlite on WebAssembly: host functions (sleep, random numbers, clock, local time) are implemented via its bundled wasm-bindgen; version matches rusqlite
[target.'cfg(target_family = "wasm")'.dependencies]
sqlite-wasm-rs = { version = "0.6.2", features = ["wasm-bindgen"] }
# Local database on the web is stored in OPFS
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
# Exported async functions (installing OPFS) convert to Promise via this crate, version matches wasm-bindgen
wasm-bindgen-futures = "=0.4.80"

# Enabled for test builds: inject storage faults, receive directly fed pull results and messages via client Probe
[features]
testing = ["syncline/testing"]

[lints]
workspace = true
