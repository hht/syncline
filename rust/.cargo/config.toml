# Compilation flags for SQLite wasm (read by `sqlite-wasm-rs` and appended to its default flags; `libsqlite3-sys` used by native ignores it).
# Disables bytecode virtual tables: `bytecode()` and `tables_used()` compile input SQL at execution time, which could allow integrator SELECT statements to execute PRAGMAs,
# bypassing the compile-time authorizer in [`Database`]; native builds disable them by default. Cargo reads this config only when executed in this directory or its subdirectories;
# invocations from elsewhere (`--manifest-path`) or environments with this variable already set will not read it: [`Database`] checks at open and errors if compiled in.
# @see https://docs.rs/crate/sqlite-wasm-rs/0.6.2/source/build.rs (SQLITE_WASM_RS_FLAGS)
# @see https://sqlite.org/bytecodevtab.html
[env]
SQLITE_WASM_RS_FLAGS = "-USQLITE_ENABLE_BYTECODE_VTAB"
