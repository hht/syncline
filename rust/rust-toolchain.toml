[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# Wasm for Node tests and web; iOS (device, Apple silicon and Intel simulators); four Android ABIs
targets = [
  "wasm32-unknown-unknown",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
]
